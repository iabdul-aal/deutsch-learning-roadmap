<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch Survival A1  -  8-Week Germany Preparation System</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 400: '#F59E0B', 500: '#EAB308', 600: '#D97706' },
            stone: { 950: '#0C0A09', 900: '#1C1917', 800: '#292524', 700: '#44403C' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            arabic: ['Cairo', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #FBF9F5; color: #1C1917; font-family: 'Inter', sans-serif; }
    .font-arabic { font-family: 'Cairo', sans-serif; }
    .dir-rtl { direction: rtl; }
    .german-flag-editorial {
      background: linear-gradient(90deg, #1C1917 33.3%, #DC2626 33.3%, #DC2626 66.6%, #D97706 66.6%);
      height: 4px;
    }
    .paper-card {
      border: 1px solid #E7E5E4;
      background-color: #FFFFFF;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function StandaloneApp() {
      const [mode, setMode] = useState('standard');
      const [streak, setStreak] = useState(5);
      const [completed, setCompleted] = useState({});

      const toggleTask = (id) => {
        setCompleted(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const playTTS = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'de-DE';
          u.rate = 0.85;
          window.speechSynthesis.speak(u);
        }
      };

      return (
        <div className="min-h-screen flex flex-col text-stone-900">
          <div className="german-flag-editorial"></div>
          
          <header className="bg-white border-b border-stone-200 p-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-xl">🇩🇪</span>
                <span className="font-extrabold text-stone-900">DEUTSCH SURVIVAL A1</span>
                <span className="text-xs text-stone-500 font-mono hidden sm:inline">| STANDALONE EDITORIAL BUNDLE</span>
              </div>

              <div className="flex items-center gap-3">
                <div className="bg-stone-100 p-0.5 rounded border border-stone-300 flex text-xs">
                  <button onClick={() => setMode('standard')} className={`px-2.5 py-0.5 rounded ${mode === 'standard' ? 'bg-white text-stone-900 font-bold border border-stone-300' : 'text-stone-600'}`}>Standard</button>
                  <button onClick={() => setMode('intensive')} className={`px-2.5 py-0.5 rounded ${mode === 'intensive' ? 'bg-rose-600 text-white font-bold' : 'text-stone-600'}`}>Intensive</button>
                </div>
                <span className="px-2.5 py-1 bg-amber-50 border border-amber-300 text-amber-900 font-bold text-xs">🔥 {streak}d Streak</span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-6 flex-1 space-y-6 w-full">
            <div className="paper-card p-6 space-y-4">
              <div className="flex items-center justify-between border-b border-stone-200 pb-3">
                <div>
                  <span className="text-[10px] font-black text-amber-700">DAY 17 OF 56  |  WEEK 3</span>
                  <h1 className="text-xl font-extrabold text-stone-900">Daily Execution Command Center</h1>
                </div>
                <button onClick={() => playTTS("Guten Tag! Willkommen in Deutschland.")} className="px-3.5 py-1.5 rounded bg-amber-500 text-stone-950 font-extrabold text-xs">
                  🔊 Listen Welcome TTS
                </button>
              </div>

              <p className="text-xs text-stone-700">
                Target Focus: <strong className="text-amber-800">Writing Messages to Landlords & Anmeldung Preparation</strong>.
              </p>

              <div className="space-y-2 pt-2">
                <div onClick={() => toggleTask('t1')} className={`p-3.5 rounded border flex items-center justify-between text-xs cursor-pointer ${completed['t1'] ? 'bg-stone-50 opacity-60' : 'bg-white hover:bg-stone-50'}`}>
                  <span>{completed['t1'] ? '[Done]' : '○'} Watch Deutsch mit Hend - A1 Lesson 16: Landlord Communication (40 min)</span>
                  <span className="text-amber-900 font-bold bg-amber-100 px-2 py-0.5 rounded border border-amber-300">PRIMARY</span>
                </div>
                <div onClick={() => toggleTask('t2')} className={`p-3.5 rounded border flex items-center justify-between text-xs cursor-pointer ${completed['t2'] ? 'bg-stone-50 opacity-60' : 'bg-white hover:bg-stone-50'}`}>
                  <span>{completed['t2'] ? '[Done]' : '○'} Watch DW Nicos Weg - Episode 12: Wohnungssuche (25 min)</span>
                  <span className="text-indigo-900 font-bold bg-indigo-100 px-2 py-0.5 rounded border border-indigo-300">SECONDARY</span>
                </div>
              </div>
            </div>
          </main>

          <footer className="border-t border-stone-200 py-3 text-center text-xs text-stone-500 font-mono">
            Deutsch Survival A1 Editorial Standalone System  |  Direct file:// Protocol Ready
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneApp />);
  </script>
</body>
</html>
